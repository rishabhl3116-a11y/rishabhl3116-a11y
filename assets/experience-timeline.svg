<svg viewBox="0 0 860 400" width="860" height="400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.lbl{opacity:0;animation:fade .6s ease-out forwards}
.d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}.d5{animation-delay:1.4s}.d6{animation-delay:1.7s}.d7{animation-delay:2s}
.year{fill:#93C5FD;font-size:12px;font-weight:600}
.role{fill:#F8FAFC;font-size:13px;font-weight:700}
.date{fill:#93C5FD;font-size:12px;font-weight:500}
.legend{fill:#DBEAFE;font-size:12px}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
</style>

<rect x="0" y="0" width="860" height="400" rx="14" fill="#0B1F3A"/>

<!-- year axis: x = 60 + (year - 2016) * 67.27 -->
<line x1="60" y1="52" x2="800" y2="52" stroke="#1E3A8A" stroke-width="2"/>
<g class="year" text-anchor="middle">
  <text x="60" y="38">2016</text><text x="127.3" y="38">2017</text><text x="194.5" y="38">2018</text><text x="261.8" y="38">2019</text>
  <text x="329.1" y="38">2020</text><text x="396.4" y="38">2021</text><text x="463.6" y="38">2022</text><text x="530.9" y="38">2023</text>
  <text x="598.2" y="38">2024</text><text x="665.5" y="38">2025</text><text x="732.7" y="38">2026</text><text x="800" y="38">2027</text>
</g>
<g stroke="#1E3A8A" stroke-width="1" stroke-dasharray="2 4">
  <line x1="60" y1="52" x2="60" y2="362"/><line x1="127.3" y1="52" x2="127.3" y2="362"/><line x1="194.5" y1="52" x2="194.5" y2="362"/><line x1="261.8" y1="52" x2="261.8" y2="362"/>
  <line x1="329.1" y1="52" x2="329.1" y2="362"/><line x1="396.4" y1="52" x2="396.4" y2="362"/><line x1="463.6" y1="52" x2="463.6" y2="362"/><line x1="530.9" y1="52" x2="530.9" y2="362"/>
  <line x1="598.2" y1="52" x2="598.2" y2="362"/><line x1="665.5" y1="52" x2="665.5" y2="362"/><line x1="732.7" y1="52" x2="732.7" y2="362"/><line x1="800" y1="52" x2="800" y2="362"/>
</g>

<!-- B.Com: 2016 - 2019 (education, outlined) -->
<text class="lbl d1" x="93.6" y="80"><tspan class="role">B.Com · University of Rajasthan</tspan><tspan class="date" dx="8">2016 – 2019</tspan></text>
<rect class="bar d1" x="93.6" y="88" width="195" height="14" rx="7" fill="#0B1F3A" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 3"/>

<!-- CA Articleship: Aug 2017 - Mar 2020 -->
<text class="lbl d2" x="166.5" y="122"><tspan class="role">Article Assistant (Audit) · Jain Sharma &amp; Co.</tspan><tspan class="date" dx="8">2017 – 2020</tspan></text>
<rect class="bar d2" x="166.5" y="130" width="174" height="14" rx="7" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5"/>

<!-- Dilly Hardware: Jun 2020 - Jul 2023 -->
<text class="lbl d3" x="357.1" y="164"><tspan class="role">Accounting Analyst · Dilly Hardware</tspan><tspan class="date" dx="8">2020 – 2023</tspan></text>
<rect class="bar d3" x="357.1" y="172" width="207" height="14" rx="7" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5"/>

<!-- M.Com: 2021 - 2023 (education, outlined) -->
<text class="lbl d4" x="430" y="206"><tspan class="role">M.Com · University of Rajasthan</tspan><tspan class="date" dx="8">2021 – 2023</tspan></text>
<rect class="bar d4" x="430" y="214" width="128" height="14" rx="7" fill="#0B1F3A" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 3"/>

<!-- Nirved Ventures: Jul 2023 - Nov 2024 (label right-aligned to bar end) -->
<text class="lbl d5" x="654.2" y="248" text-anchor="end"><tspan class="role">Financial Analyst · Nirved Ventures</tspan><tspan class="date" dx="8">2023 – 2024</tspan></text>
<rect class="bar d5" x="564.5" y="256" width="90" height="14" rx="7" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5"/>

<!-- M.S. DePaul: Jan 2025 - Jan 2027 expected (education, outlined) -->
<text class="lbl d6" x="800" y="290" text-anchor="end"><tspan class="role">M.S. Audit &amp; Advisory Services · DePaul</tspan><tspan class="date" dx="8">2025 – 2027</tspan></text>
<rect class="bar d6" x="665.5" y="298" width="134.5" height="14" rx="7" fill="#0B1F3A" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 3"/>
<g class="lbl d6">
  <circle cx="783" cy="305" r="5" fill="#93C5FD"/>
  <circle cx="783" cy="305" r="5" fill="none" stroke="#93C5FD" stroke-width="2">
    <animate attributeName="r" values="5;14" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- IHDA internship: Jun 2026 - Aug 2026 -->
<text class="lbl d7" x="772" y="332" text-anchor="end"><tspan class="role">Internal Audit Intern · IHDA</tspan><tspan class="date" dx="8">Jun – Aug 2026</tspan></text>
<rect class="bar d7" x="760.7" y="340" width="11.3" height="14" rx="7" fill="#2563EB" stroke="#DBEAFE" stroke-width="1.5"/>

<!-- legend -->
<g class="legend">
  <rect x="60" y="378" width="22" height="8" rx="4" fill="#1E3A8A" stroke="#93C5FD"/><text x="90" y="386">Work</text>
  <rect x="140" y="378" width="22" height="8" rx="4" fill="#0B1F3A" stroke="#3B82F6" stroke-dasharray="4 2"/><text x="170" y="386">Education</text>
  <circle cx="246" cy="382" r="4" fill="#93C5FD"/><text x="256" y="386">In progress (expected Jan 2027)</text>
</g>
</svg>
